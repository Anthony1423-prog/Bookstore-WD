<!doctype html><html lang="en"><meta charset="utf-8"><title>Experiment 6 - Name and Password Validation</title><h1>Name and Password Validation</h1><form id="f"><p>Name: <input id="n"></p><p>Password: <input id="p" type="password"></p><button>Validate</button></form><p id="o"></p><script>f.onsubmit=e=>{e.preventDefault();let x=[];if(!/^[A-Za-z ]{6,}$/.test(n.value.trim()))x.push('Name must be letters/spaces and at least 6 characters');if(p.value.length<6)x.push('Password must be at least 6 characters');o.textContent=x.join('. ')||'Valid'}</script></html>
