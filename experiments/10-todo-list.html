<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Experiment 10 - To-Do List</title><style>body{font:16px Arial;background:#f5f3ee;max-width:650px;margin:50px auto;padding:18px;color:#18232d}.box{background:white;padding:24px;border-radius:14px;box-shadow:0 8px 24px #0001}input{font:inherit;padding:10px;width:70%}button{padding:10px;background:#245b4a;color:white;border:0;border-radius:6px;cursor:pointer}li{padding:10px;border-bottom:1px solid #ddd}li.done{text-decoration:line-through;color:#777}.del{float:right;background:#934b3c}</style><main class="box"><h1>To-Do List</h1><p>Chosen topic demonstrating HTML, CSS and JavaScript.</p><form id="form"><input id="task" placeholder="Enter a task" required><button>Add</button></form><ul id="list"></ul></main><script>let tasks=JSON.parse(localStorage.getItem('todo-workshop')||'[]');function draw(){let ul=document.querySelector('#list');ul.innerHTML='';tasks.forEach((t,i)=>{let li=document.createElement('li');li.className=t.done?'done':'';li.textContent=t.text+' ';li.onclick=()=>{tasks[i].done=!tasks[i].done;store()};let b=document.createElement('button');b.textContent='Delete';b.className='del';b.onclick=e=>{e.stopPropagation();tasks.splice(i,1);store()};li.appendChild(b);ul.appendChild(li)})}function store(){localStorage.setItem('todo-workshop',JSON.stringify(tasks));draw()}document.querySelector('#form').onsubmit=e=>{e.preventDefault();tasks.push({text:document.querySelector('#task').value,done:false});document.querySelector('#task').value='';store()};draw()</script></html>
