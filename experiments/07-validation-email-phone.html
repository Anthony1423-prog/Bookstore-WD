<!doctype html><html lang="en"><meta charset="utf-8"><title>Experiment 7 - Email and Phone Validation</title><h1>Email and Phone Validation</h1><form id="f"><p>Email: <input id="e"></p><p>Phone: <input id="p"></p><button>Validate</button></form><p id="o"></p><script>f.onsubmit=x=>{x.preventDefault();let a=[];if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.value))a.push('Email must follow name@domain.com');if(!/^\d{10}$/.test(p.value))a.push('Phone must contain exactly 10 digits');o.textContent=a.join('. ')||'Valid'}</script></html>
